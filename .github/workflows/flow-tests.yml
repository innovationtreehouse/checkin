name: Flow tests

# Exercises real user journeys end-to-end over HTTP against a dockerized
# DEVELOPMENT server (deploy/docker-compose.flow.yml). See AGENTS.md → Flow tests.

on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write      # mint the GitHub OIDC token to assume the AWS role (no stored creds)

concurrency:
  group: flow-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-2
  # Same OIDC deploy role the deploy workflows use — needs ecr-public:GetAuthorizationToken
  # + sts:GetServiceBearerToken, and its trust policy must allow this repo's workflows.
  DEPLOY_ROLE: arn:aws:iam::639595353568:role/checkin-deploy-dev

jobs:
  flow:
    name: User-journey flow tests (docker dev server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Authenticate the image pulls. Anonymous ECR Public is rate-limited per
      # shared-runner IP; authenticated is per-account. OIDC means GitHub + AWS
      # issue short-lived tokens each run — nothing to rotate manually.
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR Public
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public

      # Pull is now authenticated; --wait then only blocks on the healthchecks
      # (start_period in the compose file covers npm ci + seed).
      - name: Start dockerized dev server + DB
        run: docker compose -f deploy/docker-compose.flow.yml up -d --wait --wait-timeout 600

      - name: Run flow tests (inside the app container)
        run: docker compose -f deploy/docker-compose.flow.yml exec -T app sh -lc "cd checkin-app && npm run test:flow"

      - name: App logs on failure
        if: failure()
        run: docker compose -f deploy/docker-compose.flow.yml logs --no-color --tail 300 app

      - name: Tear down
        if: always()
        run: docker compose -f deploy/docker-compose.flow.yml down -v
