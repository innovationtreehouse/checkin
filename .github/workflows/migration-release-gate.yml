name: Migration release gate

# REPORT, not a gate (policy change 2026-07-18): a release may apply ANY number
# of new migrations per database. Coalescing is OPTIONAL hygiene, never
# required — requiring it bought a bounded release batch at the price of dev
# ledger surgery (P3009 + reconcile + image race) on every coalesce, a
# one-step-forward-two-steps-back trade. `prisma migrate deploy` applies
# migrations SEQUENTIALLY and stops at the first failure with a failed ledger
# row; recovery is `prisma migrate resolve --rolled-back <name>` + rerun,
# and is per-migration regardless of how many a release carries.
#
# What remains automated: this report counts + lists what a release will apply
# (a ::warning:: past one per database keeps the count visible to reviewers and
# release approvers), and migration-safety.yml still warns when the unreleased
# pile grows large (>5) and keeps released migrations immutable. Voluntary
# coalesces keep their schema-identity validation there too.
# Flow doc: checkin-app/docs/MIGRATION_COALESCE_FLOW.md.

on:
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        description: Commit/tag to check (defaults to the triggering commit)
        type: string
        required: false
        default: ''
      exclude_tag:
        description: Tag being released — excluded when resolving the previous release
        type: string
        required: false
        default: ''

jobs:
  count:
    name: Migration count report (per database)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history + tags)
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || '' }}
          # Full history + tags: the gate resolves the previous v* release by
          # reachability from HEAD.
          fetch-depth: 0

      - name: Count migrations added since the previous v* release (per database)
        env:
          EXCLUDE_TAG: ${{ inputs.exclude_tag || '' }}
          # One entry per DATABASE the repo migrates — each chain gets its own
          # at-most-one budget (a release may carry one checkin migration AND
          # one mirror migration; the limits are independent because each
          # database has its own ledger and its own non-transactional
          # `prisma migrate deploy`). Add new databases here when they appear;
          # a brand-new chain should arrive as a single squashed baseline.
          MIGRATION_DIRS: |
            checkin-app/prisma/migrations
            packages/s-ingest-core/prisma/migrations
        run: |
          set -euo pipefail
          # `git tag -l` lists annotated and lightweight tags identically — no
          # special-casing needed. `sort -V` is a real version sort (v1.2.10
          # sorts after v1.2.9). Only tags REACHABLE from HEAD count as a
          # previous release; the tag being released (EXCLUDE_TAG) is excluded
          # so the release compares against its true predecessor.
          PREV_RELEASE=$(git tag --list 'v*' --merged HEAD | grep -vxF -- "$EXCLUDE_TAG" | sort -V | tail -n1 || true)

          for DIR in $MIGRATION_DIRS; do
            [ -z "$DIR" ] && continue
            HEAD_DIRS=$(git ls-tree --name-only "HEAD:$DIR" 2>/dev/null | grep -v '^migration_lock\.toml$' | sort || true)
            if [ -n "$PREV_RELEASE" ]; then
              BASE_DIRS=$(git ls-tree --name-only "$PREV_RELEASE:$DIR" 2>/dev/null | grep -v '^migration_lock\.toml$' | sort || true)
            else
              BASE_DIRS=""
            fi
            NEW_DIRS=$(comm -13 <(printf '%s\n' "$BASE_DIRS") <(printf '%s\n' "$HEAD_DIRS"))
            COUNT=$(printf '%s' "$NEW_DIRS" | grep -c . || true)
            echo "[$DIR] migrations added since ${PREV_RELEASE:-the beginning (no previous v* release reachable)}: $COUNT"
            [ -z "$NEW_DIRS" ] || printf '%s\n' "$NEW_DIRS"
            if [ "$COUNT" -gt 1 ]; then
              echo "::warning::$DIR carries $COUNT new migrations (listed above) — they apply SEQUENTIALLY at the next release. That's allowed; coalescing (checkin-app/docs/MIGRATION_COALESCE_FLOW.md) is optional hygiene if the pile feels large. A mid-batch failure stops at the failing migration with a failed ledger row; recovery: prisma migrate resolve --rolled-back <name> + rerun."
              {
                echo "### Migration count: \`$DIR\` → **$COUNT** unreleased"
                echo "Applied sequentially at the next release. Coalescing is optional (MIGRATION_COALESCE_FLOW.md); migration-safety warns past 5."
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          echo "Report complete — counts are informational; releases may carry any number of migrations."

