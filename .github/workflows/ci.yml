name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:
  # Callable so the prod release flow can RE-RUN the full pipeline (tests + the
  # deploy build/smoke) against the exact released tag before shipping — see
  # deploy-prod.yml. `ref` is the tag/SHA to validate; empty (the default for
  # push/PR/merge_group) means "the ref that triggered this run".
  workflow_call:
    inputs:
      ref:
        description: 'Git ref (tag or SHA) to check out and validate.'
        type: string
        required: false
        default: ''

jobs:
  # "Run Tests" and "Deploy build (no deploy)" are REQUIRED status checks on main.
  # The Python kiosk client (client/**) has no Node CI, so a client-only change has
  # nothing to test — but skipping the workflow via `paths-ignore` left those required
  # checks permanently "pending" and blocked client-only PRs from ever merging.
  #
  # Fix: this job decides whether anything OUTSIDE client/** changed. The required jobs
  # below ALWAYS run (so the required contexts always report a result) but skip their
  # actual work when only client/** changed. A skipped *workflow* deadlocks a required
  # check; a job that runs and reports success does not.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.detect.outputs.app }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}   # empty on push/PR = default ref; the tag when called by deploy-prod
          fetch-depth: 0

      # Guards against a repeat of PR #791 (commit 5cf40d2a): .gitignore's
      # "node_modules/" pattern is directory-only and doesn't match a symlink
      # of that name, so `git add -A` from a worktree with a symlinked
      # node_modules silently committed two symlinks pointing at an absolute
      # host path. Turbopack then panicked in the flow-test docker job
      # ("Symlink checkin-app/node_modules is invalid, it points out of the
      # filesystem root"). Lives in this job (not `test`/`deploy-build`)
      # because `changes` has no path-filter `if:` and always runs, checkout
      # already happened above, and failing here is instant — no need to
      # wait on npm ci / docker build to catch it.
      - name: Check for committed symlinks
        run: |
          SYMLINKS=$(git ls-files -s | awk '$1 == "120000" {print $4}')
          if [ -n "$SYMLINKS" ]; then
            echo "::error::Committed symlink(s) found (mode 120000):"; echo "$SYMLINKS"
            exit 1
          fi

      - id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Only a pull_request whose every changed file is under client/ may skip the
          # Node CI. push-to-main and merge_group always run the full pipeline.
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "Non-PR event ($EVENT_NAME) — running full CI."
            echo "app=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$PR_BASE_SHA...$PR_HEAD_SHA")"
          echo "Changed files:"; printf '%s\n' "$changed"
          # grep -v exits 0 if ANY line is NOT under client/ → there's app work to do.
          if printf '%s\n' "$changed" | grep -qvE '^client/'; then
            echo "Non-client files changed — running full CI."
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "Client-only change — skipping Node CI work (required checks still pass)."
            echo "app=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Run Tests
    needs: changes
    runs-on: ubuntu-latest

    # checks: write is required by dorny/test-reporter (publishes the JUnit
    # results as a Check Run below); everything else defaults to the repo's
    # standard read access.
    permissions:
      contents: read
      checks: write

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: checkmein_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Skip notice (client-only change)
        if: needs.changes.outputs.app != 'true'
        run: echo "Only client/** changed — no Node CI to run; reporting success."

      - name: Checkout code
        if: needs.changes.outputs.app == 'true'
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}   # empty on push/PR = default ref; the tag when called by deploy-prod

      - name: Setup Node.js
        if: needs.changes.outputs.app == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        if: needs.changes.outputs.app == 'true'
        run: npm ci

      - name: Lint
        if: needs.changes.outputs.app == 'true'
        run: npm run lint

      - name: Generate Prisma Client
        if: needs.changes.outputs.app == 'true'
        env:
          DATABASE_URL: "postgresql://testuser:testpassword@localhost:5432/checkmein_test"
        run: npm -w checkin-app exec -- prisma generate

      # Fast type feedback. NOTE: tsc does NOT resolve bundler imports, so it
      # misses failures that only `next build` catches (e.g. importing a deleted
      # CSS module type-checks fine yet breaks the build). The full production
      # build runs in the `deploy-build` job below.
      - name: Type check
        if: needs.changes.outputs.app == 'true'
        run: npm -w checkin-app exec -- tsc --noEmit

      # Tests run on `db push` (full schema), deploys run on `migrate deploy`
      # (only committed migrations) — so a schema change without a migration
      # passes CI and then breaks the deployed app (P2022 at runtime). Replay
      # the migrations onto a clean DB and require zero diff vs schema.prisma.
      - name: Check migrations match schema (no drift)
        if: needs.changes.outputs.app == 'true'
        env:
          DATABASE_URL: "postgresql://testuser:testpassword@localhost:5432/drift_check"
          PGPASSWORD: testpassword
        run: |
          psql -h localhost -U testuser -d checkmein_test -c 'CREATE DATABASE drift_check'
          npm -w checkin-app exec -- prisma migrate deploy
          npm -w checkin-app exec -- prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code

      - name: Push Prisma Schema
        if: needs.changes.outputs.app == 'true'
        env:
          DATABASE_URL: "postgresql://testuser:testpassword@localhost:5432/checkmein_test"
        run: npm -w checkin-app exec -- prisma db push --accept-data-loss

      - name: Verify security classifications are up to date
        if: needs.changes.outputs.app == 'true'
        env:
          DATABASE_URL: "postgresql://testuser:testpassword@localhost:5432/checkmein_test"
        run: |
          npm -w checkin-app exec -- prisma generate
          git diff --exit-code checkin-app/src/security/generated/ || (echo 'checkin-app/src/security/generated/ is stale; run prisma generate locally and commit' && exit 1)

      - name: Check route coverage (security policy lint)
        if: needs.changes.outputs.app == 'true'
        run: npm run check-route-coverage

      # Runs the WHOLE suite (unit + every *.integration.test.ts — scanAuth,
      # scanCheckin, policy.contract, …) against the test Postgres, with
      # coverage. Previously CI only ran the one hardcoded policy.contract
      # file, so the safety-critical scanAuth auth/authz suite produced zero
      # signal (issue #393); test:coverage overrides the default ignore list
      # that excludes integration tests and clones one DB per worker via
      # integrationGlobalSetup. Superset of the old separate unit-only step,
      # so that step is gone — this is the only Jest invocation now.
      # Also enforces the coverageThreshold floor in jest.config.js (fails
      # the build if coverage drops under it).
      - name: Run tests (unit + integration) with coverage
        if: needs.changes.outputs.app == 'true'
        env:
          CI: true # jest.config.js only turns on the jest-junit reporter under CI
          DATABASE_URL: "postgresql://testuser:testpassword@localhost:5432/checkmein_test"
        run: npm run test:coverage

      # Publishes checkin-app/test-results/junit.xml (jest-junit, enabled above)
      # as a Check Run: pass/fail/skip counts plus inline annotations on the
      # failing test. `if: always()` so it still runs (and shows what failed)
      # even when the test step above fails the job.
      - name: Publish test results
        if: always() && needs.changes.outputs.app == 'true'
        uses: dorny/test-reporter@v1
        with:
          name: Jest Tests
          path: checkin-app/test-results/junit.xml
          reporter: jest-junit
          fail-on-error: false # the test step above already fails the job; don't fail it twice

      # Coverage summary on the run's own Summary page — the json-summary
      # reporter (jest.config.js) already writes this file regardless of
      # pass/fail, so read it even if tests failed above.
      - name: Coverage summary
        if: always() && needs.changes.outputs.app == 'true'
        working-directory: checkin-app
        run: |
          node -e '
            const fs = require("fs");
            const path = "coverage/coverage-summary.json";
            if (!fs.existsSync(path)) { console.log("No coverage-summary.json — test run likely failed before coverage was written."); process.exit(0); }
            const t = JSON.parse(fs.readFileSync(path, "utf8")).total;
            const floor = { lines: 80, branches: 70, functions: 68 };
            const mark = (k) => (floor[k] === undefined ? "" : t[k].pct >= floor[k] ? " ✅" : " ❌");
            const lines = [
              "### Coverage",
              "| Metric | Covered / Total | % |",
              "|---|---:|---:|",
              ...["lines", "statements", "branches", "functions"].map(
                (k) => `| ${k} | ${t[k].covered}/${t[k].total} | ${t[k].pct}%${mark(k)} |`
              ),
              "",
              "Gate (jest.config.js coverageThreshold): lines ≥80%, branches ≥70%, functions ≥68%.",
            ];
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
          '

  # Build the exact production image the dev deploy uses (Dockerfile -> `npm run build`),
  # but never push or deploy it. The deploy flow's build was previously only exercised on
  # push to main, so build-only failures (e.g. a Turbopack "module not found" that tsc can't
  # see) slipped through CI and broke the post-merge deploy. Building here gates the MR.
  # It ALSO boots the built image and probes `/` (smoke test) — `docker build` alone can't
  # catch a runtime crash on startup, which only surfaced post-merge as a hung ECS rollout.
  deploy-build:
    name: Deploy build (no deploy)
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Skip notice (client-only change)
        if: needs.changes.outputs.app != 'true'
        run: echo "Only client/** changed — no deploy build to run; reporting success."

      - name: Checkout code
        if: needs.changes.outputs.app == 'true'
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}   # empty on push/PR = default ref; the tag when called by deploy-prod

      # Mirrors deploy-dev.yml's build step minus `docker push`. Architecture is irrelevant
      # (the image is discarded), so the default x64 runner is fine — the deploy builds arm64
      # on its own runner for ECS.
      - name: Build deploy image (no push)
        if: needs.changes.outputs.app == 'true'
        run: |
          docker build \
            -f checkin-app/Dockerfile \
            -t checkin-deploy-build:${{ github.sha }} .

      # Actually RUN the image: it must boot and serve `/` (mirrors the ALB health
      # check, which accepts 200-399 for the app's auth redirect). Placeholder env,
      # no DB — `/` is reachable without one. This catches a startup crash that the
      # build can't, before the change can merge and hang the post-merge rollout.
      - name: Smoke test — boot the app and probe /
        if: needs.changes.outputs.app == 'true'
        run: |
          set -uo pipefail
          docker run -d --name checkin-smoke -p 4000:4000 \
            -e NODE_ENV=production -e PORT=4000 -e HOSTNAME=0.0.0.0 \
            -e DATABASE_URL='postgresql://u:p@127.0.0.1:5432/db?sslmode=disable' \
            -e NEXTAUTH_URL='http://127.0.0.1:4000' -e AUTH_TRUST_HOST=true -e NEXTAUTH_SECRET=smoke \
            -e CHECKIN_ENV=dev -e AWS_REGION=us-east-2 \
            checkin-deploy-build:${{ github.sha }}

          ok=
          for i in $(seq 1 30); do
            if [ -z "$(docker ps -q -f name=checkin-smoke -f status=running)" ]; then
              echo "container is no longer running"; break
            fi
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4000/ || echo 000)
            case "$code" in
              2??|3??) echo "app booted — GET / -> $code"; ok=1; break ;;
            esac
            sleep 2
          done

          echo "----- container logs (tail) -----"
          docker logs checkin-smoke 2>&1 | tail -50 || true
          docker rm -f checkin-smoke >/dev/null 2>&1 || true
          [ -n "$ok" ] || { echo "::error::checkin app failed to boot / serve \"/\" within ~60s"; exit 1; }
