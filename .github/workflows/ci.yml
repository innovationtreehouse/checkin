name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'client/**'
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'client/**'
  merge_group:

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: checkmein_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        env:
          DATABASE_URL: "postgresql://testuser:testpassword@localhost:5432/checkmein_test"
        run: npx prisma generate

      # The deploy image runs `npm run build`, which type-checks. Catch type
      # errors here at PR time instead of after merge in the dev deploy.
      - name: Type check
        run: npx tsc --noEmit

      - name: Push Prisma Schema
        env:
          DATABASE_URL: "postgresql://testuser:testpassword@localhost:5432/checkmein_test"
        run: npx prisma db push --accept-data-loss

      - name: Verify security classifications are up to date
        env:
          DATABASE_URL: "postgresql://testuser:testpassword@localhost:5432/checkmein_test"
        run: |
          npx prisma generate
          git diff --exit-code src/security/generated/ || (echo 'src/security/generated/ is stale; run prisma generate locally and commit' && exit 1)

      - name: Check route coverage (security policy lint)
        run: npm run check-route-coverage

      - name: Run Jest Tests
        env:
          DATABASE_URL: "postgresql://testuser:testpassword@localhost:5432/checkmein_test"
        run: npm run test:ci

      - name: Run security policy contract tests
        env:
          DATABASE_URL: "postgresql://testuser:testpassword@localhost:5432/checkmein_test"
        run: npx jest tests/security/policy.contract.integration.test.ts --runInBand --forceExit --testPathIgnorePatterns=/node_modules/
