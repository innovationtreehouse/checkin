name: Deploy prod

# Deploy the checkin app to the AWS prod environment when a release is
# published in this repo. Mirrors deploy-dev.yml step-for-step (build an ARM64
# image, run DB migrations, roll out the ECS service) with these differences:
#   - trigger: a published GitHub release instead of a merge to main
#   - guard:   RE-RUNS the entire CI pipeline (tests + the deploy build/smoke)
#              against the released tag — see the `validate` job. A release can
#              be cut from ANY commit, and stale or partial check status on that
#              commit is not trustworthy, so we revalidate from scratch rather
#              than querying past check-runs. `deploy` needs `validate`.
#   - gate:    `deploy` targets the `production` GitHub Environment, which holds
#              the human-approval rule (required reviewers — one approval). The
#              validate job runs first (no environment), so the reviewer approves
#              a release that has already gone green on its own tag.
#   - report:  a run step summary (releases have no comment thread to post to)
#
# Auth is GitHub OIDC (no static AWS keys) — assumes the checkin-deploy-prod
# role defined in ~/projects/treehouse/aws/infra/modules/checkin/iam.tf.
#
# Cutting a release:
#   gh release create v1.2.3 --target main --generate-notes
# Publishing (not drafting) is what fires this. Re-publishing a draft works;
# pre-releases deploy too — don't mark a release pre if it shouldn't ship.

on:
  release:
    types: [published]

permissions:
  id-token: write   # assume the deploy role via OIDC (deploy job only)
  contents: read    # checkout the released tag (validate + deploy)
  # checks: write is not used by THIS workflow — it's the ceiling for the
  # reusable ci.yml call: its `test` job requests checks: write (dorny
  # test-reporter), and a called job may never exceed the caller's grants.
  # Without this line the run dies at startup_failure with zero jobs —
  # which is exactly how v1.0.0's first deploy attempt failed (2026-07-14).
  checks: write

concurrency:
  group: checkin-deploy-prod
  cancel-in-progress: false  # serialize deploys; never abandon one mid-rollout

env:
  AWS_REGION: us-east-2
  ECR_REGISTRY: 639595353568.dkr.ecr.us-east-2.amazonaws.com
  ECR_REPOSITORY: checkin-prod
  # Prod runs on the shared Managed-Instances cluster, not a dedicated
  # checkin-prod cluster (infra #104 destroyed that one). Names below come from
  # the infra repo — see the "prod infra" note in the PR description.
  ECS_CLUSTER: treehouse-prod
  ECS_SERVICE: checkin-prod
  ECS_CAPACITY_PROVIDER: treehouse-prod-c6g
  APP_TASK_FAMILY: checkin-prod
  MIGRATE_TASK_FAMILY: checkin-migrate-prod
  DEPLOY_ROLE: arn:aws:iam::639595353568:role/checkin-deploy-prod
  APP_URL: https://ops.innovationtreehouse.org

jobs:
  # Re-run the FULL CI pipeline (lint, type-check, migration-drift, Jest, the
  # security contract tests, AND the deploy build + boot/smoke) against the exact
  # released tag. This is the H1 fix: a release tag can point at any commit, and
  # we no longer trust whatever check status happened to exist there — we prove
  # the released code green from scratch before a human is even asked to approve.
  validate:
    name: Revalidate CI on the released tag
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ github.event.release.tag_name }}
    secrets: inherit

  # Release gate: a release may apply AT MOST ONE new database migration.
  # Migrations accumulate on main between releases and must be coalesced into
  # a single migration (checkin-app/scripts/coalesce-migrations.ts, a manual
  # PR) before a release ships them — see
  # checkin-app/docs/MIGRATION_COALESCE_FLOW.md for the policy and flow.
  #
  # This is not a step inside `validate`: that job is a reusable-workflow
  # `uses: ./.github/workflows/ci.yml` call, which has no step surface of its
  # own to add to. Runs as its own job instead; `deploy` needs both.
  migration-release-gate:
    name: Release gate — at most 1 new migration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout released tag (full history + tags)
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Find the previous v* release tag and count added migrations
        run: |
          set -euo pipefail
          CURRENT_TAG="${{ github.event.release.tag_name }}"
          git fetch --tags --force

          # `git tag -l` lists annotated and lightweight tags identically — no
          # special-casing needed for either kind. `sort -V` is a real version
          # sort (v1.2.10 sorts after v1.2.9), not a lexical one.
          mapfile -t TAGS < <(git tag -l 'v*' | sort -V)

          PREV_TAG=""
          for i in "${!TAGS[@]}"; do
            if [ "${TAGS[$i]}" = "$CURRENT_TAG" ]; then
              if [ "$i" -gt 0 ]; then PREV_TAG="${TAGS[$((i-1))]}"; fi
              break
            fi
          done

          if [ -z "$PREV_TAG" ]; then
            echo "No v* release tag found before $CURRENT_TAG — this is the first release, nothing to gate against. Skipping."
            exit 0
          fi
          echo "Previous release tag: $PREV_TAG"

          # Count ADDED migration directories only — a coalesce release
          # deletes many old ones and adds exactly 1, and that must PASS, not
          # fail on the deletes. Count directories, not files: a coalesce
          # baseline adds both migration.sql and reconcile.sql under one dir.
          # --no-renames: a rewritten baseline must never be mistaken for a
          # rename of one of the migrations it replaces.
          mapfile -t ADDED < <(git diff --no-renames --name-status "$PREV_TAG"..HEAD -- checkin-app/prisma/migrations \
            | awk '$1=="A" {print $2}' | awk -F/ '{print $4}' | grep -v '^migration_lock.toml$' | sort -u)
          echo "New migration dir(s) since $PREV_TAG (${#ADDED[@]}): ${ADDED[*]:-none}"

          if [ "${#ADDED[@]}" -gt 1 ]; then
            echo "::error::This release would apply ${#ADDED[@]} new migrations (${ADDED[*]}) — a release may apply at most 1. Coalesce them into a single migration first: checkin-app/docs/MIGRATION_COALESCE_FLOW.md"
            exit 1
          fi
          echo "OK — at most 1 new migration since the previous release."

  deploy:
    name: Build, migrate, roll out
    needs: [validate, migration-release-gate]   # do not build/migrate/roll out unless the tag re-passed all of CI and the release gate
    runs-on: ubuntu-24.04-arm  # native ARM64 — task defs require arm64 images
    environment:
      name: production
      url: https://ops.innovationtreehouse.org
    steps:
      - name: Checkout released tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Resolve released commit
        id: vars
        run: |
          # release.target_commitish can be a branch name, so resolve the SHA
          # from the checked-out tag itself.
          SHA=$(git rev-parse HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHA:0:7}" >> "$GITHUB_OUTPUT"
          echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: build
        env:
          IMAGE: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ steps.vars.outputs.sha }}
          IMAGE_TAGGED: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ steps.vars.outputs.tag }}
        run: |
          set -euo pipefail
          # Native arm64 runner -> a plain build produces the arm64 image the
          # ECS task defs require (runtime_platform.cpu_architecture = ARM64).
          docker build \
            -t "$IMAGE" -t "$IMAGE_TAGGED" .
          docker push "$IMAGE"
          docker push "$IMAGE_TAGGED"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Run database migrations
        env:
          IMAGE: ${{ steps.build.outputs.image }}
        run: |
          set -euo pipefail
          # Register a new revision of the migrate task def pointing at the new
          # image (run-task can't override the image, only command/env), keeping
          # only the fields register-task-definition accepts. Goes through a real
          # temp file: the runner's aws CLI cannot read file:///dev/stdin.
          aws ecs describe-task-definition \
            --task-definition "$MIGRATE_TASK_FAMILY" \
            --query taskDefinition --output json \
            | jq --arg IMG "$IMAGE" '
                .containerDefinitions[0].image = $IMG
                | {family, taskRoleArn, executionRoleArn, networkMode,
                   containerDefinitions, requiresCompatibilities, cpu, memory,
                   runtimePlatform}' > "$RUNNER_TEMP/migrate-taskdef.json"
          MIGRATE_ARN=$(aws ecs register-task-definition \
            --cli-input-json "file://$RUNNER_TEMP/migrate-taskdef.json" \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "Registered migrate task def: $MIGRATE_ARN"

          # The shared Aurora cluster is Serverless v2 with min capacity 0 and
          # auto-pause: if it's idle at deploy time, the first connection races
          # the ~30s resume and Prisma fails fast with P1001. Override the
          # container command with a retry loop so the task survives the wake-up.
          cat > "$RUNNER_TEMP/migrate-overrides.json" <<'EOF'
          {
            "containerOverrides": [{
              "name": "checkin-migrate",
              "command": ["sh", "-c",
                "for i in 1 2 3 4 5; do npx prisma migrate deploy && exit 0; echo \"attempt $i failed — DB may be resuming from auto-pause; retrying in 20s\"; sleep 20; done; exit 1"]
            }]
          }
          EOF

          # treehouse-prod is ECS Managed Instances: the app + migrate task defs
          # are host-networked/EC2-compatible here (modules/checkin/compute.tf),
          # and the service itself has no networkConfiguration (its dynamic
          # block is empty on Managed Instances) — unlike dev's Fargate/awsvpc
          # path, there is no network config to copy and no FARGATE launch type
          # to use. Launch via the cluster's capacity provider instead, with no
          # --network-configuration at all.
          TASK_ARN=$(aws ecs run-task \
            --cluster "$ECS_CLUSTER" \
            --task-definition "$MIGRATE_ARN" \
            --capacity-provider-strategy capacityProvider=$ECS_CAPACITY_PROVIDER,weight=1 \
            --overrides "file://$RUNNER_TEMP/migrate-overrides.json" \
            --query 'tasks[0].taskArn' --output text)
          echo "Migration task: $TASK_ARN"

          aws ecs wait tasks-stopped --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN"

          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' --output text)
          echo "Migration exit code: $EXIT_CODE"

          # Surface the container's own output either way — without this, a failure
          # only shows the exit code here and the real Prisma error (P3009 etc.)
          # hides in CloudWatch, which is how the 2026-07-02 P3009 wedge went
          # undiagnosed for a day (mirrors deploy-dev.yml).
          TASK_ID="${TASK_ARN##*/}"
          echo "--- migrate container logs (/ecs/checkin-migrate-prod) ---"
          aws logs get-log-events \
            --log-group-name /ecs/checkin-migrate-prod \
            --log-stream-name "ecs/checkin-migrate/$TASK_ID" \
            --start-from-head --limit 200 \
            --query 'events[].message' --output text | tr '\t' '\n' || echo "(could not fetch logs)"
          echo "--- end migrate container logs ---"

          if [ "$EXIT_CODE" != "0" ]; then
            echo "::error::Database migration failed (exit $EXIT_CODE) — see migrate container logs above"
            exit 1
          fi

      - name: Deploy to ECS
        env:
          IMAGE: ${{ steps.build.outputs.image }}
        run: |
          set -euo pipefail
          # Register a new app task-def revision with the new image. The service
          # has lifecycle.ignore_changes on task_definition, so CI owns rollout.
          # Same temp-file dance as the migrate step (no /dev/stdin on the runner).
          aws ecs describe-task-definition \
            --task-definition "$APP_TASK_FAMILY" \
            --query taskDefinition --output json \
            | jq --arg IMG "$IMAGE" '
                .containerDefinitions[0].image = $IMG
                | {family, taskRoleArn, executionRoleArn, networkMode,
                   containerDefinitions, volumes, placementConstraints,
                   requiresCompatibilities, cpu, memory, runtimePlatform}' > "$RUNNER_TEMP/app-taskdef.json"
          APP_ARN=$(aws ecs register-task-definition \
            --cli-input-json "file://$RUNNER_TEMP/app-taskdef.json" \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "Registered app task def: $APP_ARN"

          aws ecs update-service \
            --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" \
            --task-definition "$APP_ARN" >/dev/null

          echo "Waiting for the service to reach steady state..."
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE"
          echo "Service is stable."

      - name: Report result
        if: always()
        env:
          TAG: ${{ steps.vars.outputs.tag }}
          SHORT_SHA: ${{ steps.vars.outputs.short_sha }}
          STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RELEASE_URL: ${{ github.event.release.html_url }}
        run: |
          set -euo pipefail
          if [ "$STATUS" = "success" ]; then
            {
              echo "### ✅ Released $TAG to prod"
              echo "Commit \`$SHORT_SHA\` is live on [$APP_URL]($APP_URL)."
              echo "- Image: \`$ECR_REPOSITORY:$TAG\`"
              echo "- Migrations: applied · Service: stable"
              echo "- [Release]($RELEASE_URL) · [Deploy run]($RUN_URL)"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### ❌ Prod deploy of $TAG failed (status: \`$STATUS\`)"
              echo "- [Deploy run]($RUN_URL) — check the logs."
              echo "- Prod still runs the previous image."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
