version: '3.8'

services:
  db:
    image: public.ecr.aws/docker/library/postgres:15
    environment:
      POSTGRES_USER: prisma
      POSTGRES_PASSWORD: prismapassword
      POSTGRES_DB: checkmein
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    # Context is the repo root (one level up from deploy/) so the workspace
    # install resolves the root manifest/lockfile and every workspace member.
    build:
      context: ..
      dockerfile: checkin-app/Dockerfile
    ports:
      - "4000:4000"
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql://prisma:prismapassword@db:5432/checkmein?schema=public
    depends_on:
      - db

volumes:
  postgres_data:
